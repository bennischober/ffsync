name: WAN measurement

# One-shot experiment (manual dispatch, never on push): the RUNNER is the
# RECEIVER behind a Cloudflare quick tunnel; the local machine is the SENDER.
# This is the shared-bottleneck WAN path the toxiproxy experiment could not
# simulate: K connections share one real pipe (the home UPLINK, the scarce
# direction on typical connections).
#
#   runner: cloudflared tunnel (tcp) -> ffsync receive 7788 --parallel K
#   local:  cloudflared access tcp --hostname <url> --url 127.0.0.1:7789
#           ffsync send <fixture> 127.0.0.1:7789 --parallel K
#
# Coordination: the receiver runs ALL cells in one job, printing
# "READY k=N" before each cell; the local operator starts the matching
# sender when the marker appears (one dispatch per K, sender-side timed).
# The job streams its log live; nothing here waits on the sender except
# the receive call itself. Each cell hash-verifies receiver content
# against the fixture and records wall time server-side too (includes
# the local sender's connect+scan; treat as upper bound).
#
# Fixture: bench --gen-tree, seed 42 (100 files, 423 MiB, 8 dirs) — the
# same fixture as the model and toxiproxy rows in evaluation/parallel.md.

on:
  workflow_dispatch:
    inputs:
      cells:
        description: "comma list of --parallel values to receive, in order (e.g. 1,4,8,16)"
        required: true
        default: "1,4,8,16"
      sender_fp:
        description: "SHA-256 fingerprint of the local sender identity (pinned with --trust)"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  receive:
    name: wan receiver
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release --locked
      - name: Generate fixture (seed 42)
        run: ./target/release/bench --gen-tree --out-dir fixture --seed 42
      - name: Install cloudflared
        run: |
          curl -L -o cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
      - name: Identity + tunnel
        id: setup
        run: |
          FP_RECV="$(./target/release/ffsync fingerprints | grep 'this peer:' | sed 's/this peer: *//')"
          echo "receiver fingerprint: $FP_RECV"
          echo "fp=$FP_RECV" >> "$GITHUB_OUTPUT"
          ./cloudflared tunnel --url tcp://127.0.0.1:7788 --no-autoupdate > tunnel.log 2>&1 &
          sleep 10
          URL="$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' tunnel.log | head -1)"
          echo "TUNNEL URL: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          if [ -z "$URL" ]; then exit 1; fi
      - name: Receive cells
        run: |
          FP_SEND="${{ inputs.sender_fp }}"   # pinned by --trust per cell
          FP_RECV="${{ steps.setup.outputs.fp }}"
          URL="${{ steps.setup.outputs.url }}"
          echo "=== SENDER INSTRUCTIONS ==="
          echo "tunnel: $URL"
          echo "receiver fp (pin with --trust): $FP_RECV"
          IFS=',' read -ra CELLS <<< "${{ inputs.cells }}"
          : > cells.txt
          for K in "${CELLS[@]}"; do
            K="$(echo "$K" | tr -d ' ')"
            rm -rf recv_tree && mkdir recv_tree
            ARGS=()
            [ "$K" -gt 1 ] && ARGS=(--parallel "$K")
            echo "READY k=$K"          # operator starts the sender NOW
            START=$(date +%s.%N)
            timeout 900 ./target/release/ffsync receive recv_tree 7788 "${ARGS[@]}" \
              --trust "$FP_SEND" > "recv_k${K}.log" 2>&1
            RC=$?
            END=$(date +%s.%N)
            WALL=$(echo "$END $START" | awk '{printf "%.2f", $1-$2}')
            HASH_R="$(find recv_tree -type f ! -name '*.ffsync-*' -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
            HASH_S="$(find fixture/lat_sender -type f ! -name '*.ffsync-*' -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
            COUNT_R="$(find recv_tree -type f ! -name '*.ffsync-*' | wc -l)"
            if [ "$HASH_R" = "$HASH_S" ] && [ "$COUNT_R" -eq 100 ]; then CONV=yes; else CONV=NO; fi
            echo "CELL K=$K rc=$RC wall=${WALL}s converged=$CONV files=$COUNT_R"
            echo "K=$K rc=$RC wall=${WALL}s converged=$CONV" >> cells.txt
            sleep 3   # let the sender's connection teardown drain
          done
          echo "==== CELLS ===="
          cat cells.txt
      - name: Upload cell results + receiver logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wan-results
          path: |
            cells.txt
            recv_k*.log
            tunnel.log
          retention-days: 7
