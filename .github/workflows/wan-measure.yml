name: WAN measurement

# One-shot experiment (manual dispatch, never on push). The RUNNER is the
# SENDER; the local machine (home uplink = the shared bottleneck pipe) is
# the RECEIVER. Zero-coordination design: the operator opens FOUR local
# receivers (fresh empty tree each, one per --parallel value) behind FOUR
# quick tunnels and passes their hostnames as inputs; this workflow then
# sends cell-by-cell with nobody waiting on markers.
#
#   runner: cloudflared access tcp --hostname <t_K> --url 127.0.0.1:970K
#           ffsync send fixture 127.0.0.1:970K [--parallel K]  (timed)
#   local:  cloudflared tunnel --url tcp://127.0.0.1:778K
#           ffsync receive recv_tree_K 778K --plaintext
#
# Plaintext both ends by design: the tunnel is TLS-terminated end to end
# (access client <-> Cloudflare edge <-> tunnel process), and a one-shot
# measurement does not justify the ephemeral-identity pin dance (D16
# explicitly allows plaintext inside tunnels). This also removes the TLS
# handshake as a variable across cells.
#
# Timing: wall time around the send process (connect + manifest + data +
# commit), comparable across cells because the sender-side scan is
# identical. Receiver-side convergence is verified on the operator's
# machine after the run (hash of each recv tree vs the seed-42 fixture).

on:
  workflow_dispatch:
    inputs:
      t1:
        description: "tunnel hostname for the K=1 cell (no https://)"
        required: true
      t4:
        description: "tunnel hostname for the K=4 cell (no https://)"
        required: true
      t8:
        description: "tunnel hostname for the K=8 cell (no https://)"
        required: true
      t16:
        description: "tunnel hostname for the K=16 cell (no https://)"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  send:
    name: wan sender (cells 1,4,8,16)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release --locked
      - name: Generate fixture (seed 42)
        run: ./target/release/bench --gen-tree --out-dir fixture --seed 42
      - name: Install cloudflared
        run: |
          curl -L -o cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
      - name: Send cells
        run: |
          : > cells.txt
          send_cell() {
            local K="$1" HOST="$2" PORT="$3"
            ./cloudflared access tcp --hostname "$HOST" --url "127.0.0.1:$PORT" \
              > "access_k${K}.log" 2>&1 &
            local APID=$!
            # wait for the local forwarder to accept
            local ok=""
            for i in $(seq 1 20); do
              if (exec 3<>/dev/tcp/127.0.0.1/$PORT) 2>/dev/null; then ok=1; exec 3<&- 3>&-; break; fi
              sleep 1
            done
            if [ -z "$ok" ]; then
              echo "CELL K=$K rc=access-dead wall=0 converged=NO" | tee -a cells.txt
              kill $APID 2>/dev/null; return
            fi
            local ARGS=()
            [ "$K" -gt 1 ] && ARGS=(--parallel "$K")
            local START=$(date +%s.%N)
            timeout 900 ./target/release/ffsync send fixture/lat_sender \
              "127.0.0.1:$PORT" --plaintext "${ARGS[@]}" \
              > "send_k${K}.log" 2>&1
            local RC=$?
            local END=$(date +%s.%N)
            local WALL=$(echo "$END $START" | awk '{printf "%.2f", $1-$2}')
            echo "CELL K=$K rc=$RC wall=${WALL}s (receiver-side verify: operator)" | tee -a cells.txt
            kill $APID 2>/dev/null
            sleep 5
          }
          send_cell 1  "${{ inputs.t1 }}"  9701
          send_cell 4  "${{ inputs.t4 }}"  9702
          send_cell 8  "${{ inputs.t8 }}"  9703
          send_cell 16 "${{ inputs.t16 }}" 9704
          echo "==== CELLS ===="
          cat cells.txt
      - name: Upload cell results + sender logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wan-results
          path: |
            cells.txt
            send_k*.log
            access_k*.log
          retention-days: 7
