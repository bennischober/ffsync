name: Release

# Cut a release by pushing a version tag; the workflow publishes the crate
# to crates.io and attaches versioned executables (with SHA-256 checksums)
# to the GitHub release. The tag is the single source of truth — exactly
# how v0.3.0 was cut by hand first (bump → tag → release notes).
#
#   git tag -a vX.Y.Z -m "..."
#   git push origin main vX.Y.Z
#
# Safety rails:
# - the verify job refuses to run when the tag name and Cargo.toml version
#   disagree (publishing v0.3.1 with version = "0.3.0" would ship the
#   wrong thing to an immutable registry),
# - publish runs only after the full test suite passed on the tagged commit,
# - the token is a fine-grained secret (publish-update scope), not the
#   legacy crate-owner token.
#
# Manual runs (workflow_dispatch) act as dry runs: verify + artifact builds
# execute, publish and release attachment are skipped.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write # attach artifacts to the release

jobs:
  verify:
    name: verify (tag ↔ version, gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tag name matches Cargo.toml version
        # Only meaningful on tag pushes; workflow_dispatch runs on a branch
        # (ref = main), where there is no version tag to compare.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "ffsync") | .version')"
          if [ "$TAG" != "$CARGO_VERSION" ]; then
            echo "::error::tag v$TAG does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi
          echo "tag v$TAG == Cargo.toml $CARGO_VERSION"
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy (all targets, deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      - name: Package dry run
        run: cargo package --locked

  publish:
    name: publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    # Only real tag pushes publish; workflow_dispatch dry runs stop here.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

  artifacts:
    name: executables / ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows is the primary development platform; the plain .exe zip
          # is the main download for end users (no toolchain required).
          # Asset names use friendly platform labels (node/go style), not
          # Rust target triples — the triple stays a build detail here.
          - name: windows-x64
            target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - name: linux-x64
            target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar
          # ARM64 Linux (Raspberry Pi 5, Graviton, ARM servers). Native arm64
          # runner — no cross-compilation, ring's C code builds in place.
          - name: linux-arm64
            target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            archive: tar
          # ARM64 Windows (Surface Pro X class, ARM laptops). The runner
          # image ships Visual Studio with the native ARM64 toolset, so
          # aarch64-pc-windows-msvc needs no extra tooling (rustup's own CI
          # builds it on this image). Opportunistic entry: if the toolchain
          # or ring misbehaves, drop it — linux-arm64 is the valuable one.
          - name: windows-arm64
            target: aarch64-pc-windows-msvc
            os: windows-11-arm
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # ring (via rustls/rcgen) compiles C code; the musl targets need the
      # musl-gcc wrapper, which the runner image does not preinstall.
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # On the arm64 runner, make ring's C compilation use the musl wrapper
      # explicitly (glibc-compiled C objects do not link against musl
      # libc.a). The x64 musl build resolves this without the hint.
      - name: Point C toolchain at musl (arm64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          echo "CC_aarch64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          # Windows MSVC links the dynamic CRT by default, which makes the
          # exe depend on VCRUNTIME140.dll (absent on machines without the
          # VC++ redistributable — hardly "portable"). crt-static embeds the
          # runtime; verified locally: no VCRUNTIME imports in the PE.
          # Applies to both windows targets (x64 and arm64).
          RUSTFLAGS: ${{ contains(matrix.target, 'windows-msvc') && '-C target-feature=+crt-static' || '' }}
      - name: Package (zip)
        id: package
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $stage = "ffsync-${{ github.ref_name }}-${{ matrix.name }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/ffsync.exe" "$stage/"
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE $stage/
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
          "artifact=$stage.zip" | Out-File $env:GITHUB_OUTPUT -Append
      - name: Package (tar.gz)
        id: package-tar
        if: matrix.archive == 'tar'
        run: |
          stage="ffsync-${{ github.ref_name }}-${{ matrix.name }}"
          mkdir "$stage"
          cp "target/${{ matrix.target }}/release/ffsync" "$stage/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$stage/"
          tar czf "$stage.tar.gz" "$stage"
          echo "artifact=$stage.tar.gz" >> "$GITHUB_OUTPUT"
      # Per-artifact .sha256 sidecar (kernel.org style) — matrix jobs run on
      # different runners, so a single merged checksums.txt would need an
      # extra join job; sidecars attach independently and verify the same way.
      - name: SHA-256 checksum
        shell: pwsh
        run: |
          $artifact = if ("${{ matrix.archive }}" -eq "zip") { "${{ steps.package.outputs.artifact }}" } else { "${{ steps.package-tar.outputs.artifact }}" }
          if (-not $artifact) { throw "no artifact produced" }
          $hash = (Get-FileHash $artifact -Algorithm SHA256).Hash.ToLower()
          "$hash  $artifact" | Out-File "$artifact.sha256" -Encoding ascii
          Get-Content "$artifact.sha256"
      # Release notes come from the CHANGELOG section matching the tag
      # (Keep-a-Changelog layout: "## [X.Y.Z] - date"). Each matrix job
      # computes the same body; the release-creating job wins, subsequent
      # attaches overwrite it with identical content (idempotent). A missing
      # section warns and falls back to the tag name rather than failing
      # four completed builds.
      - name: Extract release notes from CHANGELOG
        id: notes
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $text = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $m = [regex]::Match($text, "(?s)## \[$([regex]::Escape($version))\][^\r\n]*\r?\n(.*?)(?=\r?\n## \[|\z)")
          if ($m.Success) {
            $body = $m.Groups[1].Value.TrimEnd()
          } else {
            Write-Output "::warning::no CHANGELOG section for $version — using tag name as release notes"
            $body = "ffsync ${{ github.ref_name }}"
          }
          $delim = [Guid]::NewGuid().ToString("N")
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "body<<$delim`n$body`n$delim`n", [Text.Encoding]::UTF8)
      - name: Attach to release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.body }}
          files: |
            ffsync-*.zip
            ffsync-*.tar.gz
            ffsync-*.sha256
