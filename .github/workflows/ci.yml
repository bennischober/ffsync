name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary development platform; Ubuntu exercises the
        # #[cfg(unix)] branch of the positional-I/O layer (FileExt).
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Only two bins and a lib — caching keeps the suite at ~1-2 min.
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy (all targets, deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # cargo-audit is not preinstalled on runner images; install the
      # prebuilt binary (fast) instead of compiling it from source.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Runs on every push/PR; the weekly scheduled cadence for drifted
      # advisories is covered by the separate audit-weekly workflow (D14).
      - run: cargo audit

  msrv:
    name: msrv (rust-version = 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep the declared rust-version honest: if a dependency bump or a
      # new language feature silently raises the real floor, this job
      # fails and the field gets updated deliberately, not by accident.
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.88
      - run: cargo check --all-targets
