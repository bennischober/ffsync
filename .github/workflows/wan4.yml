name: WAN measurement

# One-shot experiment (manual dispatch, never on push): the RUNNER is the
# RECEIVER behind a Cloudflare quick tunnel; the local machine is the SENDER.
# This is the shared-bottleneck WAN path the toxiproxy experiment could not
# simulate: K connections share one real pipe (the home UPLINK, the scarce
# direction on typical connections).
#
#   runner: cloudflared tunnel (tcp) -> ffsync receive 7788 --parallel K
#   local:  cloudflared access tcp --hostname <url> --url 127.0.0.1:7789
#           ffsync send <fixture> 127.0.0.1:7789 --parallel K
#
# Coordination: the receiver runs ALL cells in one job, printing
# "READY k=N" before each cell; the local operator starts the matching
# sender when the marker appears (one dispatch per K, sender-side timed).
# The job streams its log live; nothing here waits on the sender except
# the receive call itself. Each cell hash-verifies receiver content
# against the fixture and records wall time server-side too (includes
# the local sender's connect+scan; treat as upper bound).
#
# Fixture: bench --gen-tree, seed 42 (100 files, 423 MiB, 8 dirs) — the
# same fixture as the model and toxiproxy rows in evaluation/parallel.md.

on:
  workflow_dispatch:
    inputs:
      cells:
        description: "comma list of --parallel values to receive, in order (e.g. 1,4,8,16)"
        required: true
        default: "1,4,8,16"

env:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo head-bisect
