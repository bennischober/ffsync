\* Mutation: the sequential barrier read runs although the control loop
\* consumed TREE_END. Expected: deadlock (reference sender).
CONSTANTS
    Files = {f1, f2, f3}
    Extra = xtra
    NoFile = nofile
    K = 3
    MaxFaults = 1
    Hostile = FALSE
    HostileBudget = 0
    BarrierGate = FALSE
    JoinBeforeDecide = TRUE
    MembershipCheck = TRUE
    RemainingCheck = TRUE

SPECIFICATION Spec
CHECK_DEADLOCK TRUE
INVARIANTS
    TypeOK
    ExactlyOnce
    NoStranger
    DeleteSafe
    FailClosed
    SenderTruth
PROPERTIES
    DecideClean
    Termination
