[package]
name = "ffsync"
version = "0.1.0"
edition = "2024"
description = "Chunk-level file synchronization for big files and fast links"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bennischober/ffsync"

[dependencies]
blake3 = { version = "1.8.7" }
fastcdc = { version = "5.0.0", features = ["tokio"] }
rand = "0.10.3"
tokio = { version = "1.54.1", features = ["full"] }
num_cpus = "1.17.0"
memmap2 = "0.9.12"
crossbeam = "0.8.5"

[[test]]
name = "integration"
path = "tests/integration.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

